services:
  - type: web
    name: domeno
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: دومينو
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_LOCALE
        value: ar
      - key: APP_FALLBACK_LOCALE
        value: ar
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: sqlite
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
